  # Sign-in flow dialog

  signin_dialog_heading:
    en: "Sign in with Claude"
    fr: "Se connecter avec Claude"
    nl: "Aanmelden met Claude"
    de: "Mit Claude anmelden"
    es: "Iniciar sesión con Claude"
    pt: "Iniciar sessão com Claude"
    sv: "Logga in med Claude"
    cs: "Přihlásit se přes Claude"
    pl: "Zaloguj się przez Claude"
    ru: "Войти через Claude"
    uk: "Увійти через Claude"
    ar: "تسجيل الدخول باستخدام Claude"
    fa: "ورود با Claude"
    zh: "使用 Claude 登录"
    ja: "Claude でサインイン"
    ko: "Claude로 로그인"
    tr: "Claude ile oturum aç"
    it: "Accedi con Claude"
    hi: "Claude से साइन इन करें"
  signin_dialog_body:
    en: "Your browser should have opened to claude.ai. Complete sign-in there, then return here. This dialog will close automatically."
    fr: "Votre navigateur devrait s'être ouvert sur claude.ai. Terminez la connexion là-bas, puis revenez ici. Cette boîte de dialogue se fermera automatiquement."
    nl: "Uw browser zou claude.ai geopend moeten hebben. Voltooi daar de aanmelding en kom dan hier terug. Dit dialoogvenster wordt automatisch gesloten."
    de: "Ihr Browser sollte sich auf claude.ai geöffnet haben. Schließen Sie die Anmeldung dort ab und kehren Sie dann hierher zurück. Dieses Dialogfeld wird automatisch geschlossen."
    es: "Su navegador debería haberse abierto en claude.ai. Complete el inicio de sesión allí y luego vuelva aquí. Este cuadro de diálogo se cerrará automáticamente."
    pt: "O seu navegador deverá ter aberto em claude.ai. Conclua o início de sessão aí e regresse a esta janela. Esta caixa de diálogo será fechada automaticamente."
    sv: "Din webbläsare bör ha öppnats på claude.ai. Slutför inloggningen där och återvänd sedan hit. Den här dialogrutan stängs automatiskt."
    cs: "Váš prohlížeč by se měl otevřít na claude.ai. Dokončete tam přihlášení a poté se vraťte sem. Toto dialogové okno se automaticky zavře."
    pl: "Twoja przeglądarka powinna otworzyć stronę claude.ai. Dokończ tam logowanie i wróć tutaj. To okno dialogowe zostanie zamknięte automatycznie."
    ru: "Ваш браузер должен был открыть claude.ai. Завершите вход там и вернитесь сюда. Это диалоговое окно закроется автоматически."
    uk: "Ваш браузер мав відкрити claude.ai. Завершіть вхід там і поверніться сюди. Це діалогове вікно закриється автоматично."
    ar: "من المفترض أن يكون متصفحك قد فتح claude.ai. أكمل تسجيل الدخول هناك ثم عُد إلى هنا. سيُغلق مربع الحوار هذا تلقائيًا."
    fa: "مرورگر شما باید claude.ai را باز کرده باشد. ورود را در آنجا تکمیل کنید و سپس به اینجا بازگردید. این پنجره به‌طور خودکار بسته می‌شود."
    zh: "您的浏览器应已打开 claude.ai。请在那里完成登录,然后返回此处。此对话框将自动关闭。"
    ja: "ブラウザで claude.ai が開いているはずです。そちらでサインインを完了し、こちらに戻ってください。このダイアログは自動的に閉じます。"
    ko: "브라우저가 claude.ai로 열렸을 것입니다. 그곳에서 로그인을 완료한 후 이 화면으로 돌아오십시오. 이 대화 상자는 자동으로 닫힙니다."
    tr: "Tarayıcınız claude.ai adresini açmış olmalı. Oturum açmayı orada tamamlayın ve buraya geri dönün. Bu iletişim kutusu otomatik olarak kapanacak."
    it: "Il tuo browser dovrebbe aver aperto claude.ai. Completa l'accesso lì, quindi torna qui. Questa finestra di dialogo si chiuderà automaticamente."
    hi: "आपका ब्राउज़र claude.ai पर खुल गया होगा। वहाँ साइन-इन पूरा करें, फिर यहाँ लौटें। यह संवाद स्वतः बंद हो जाएगा।"


