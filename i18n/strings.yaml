  # Preferences — fields

  prefs_account_subtitle:
    en: "Sign in with your Claude account to fetch Max plan usage. Tokens are stored in GNOME Keyring via libsecret."
    fr: "Connectez-vous avec votre compte Claude pour récupérer l'utilisation du plan Max. Les jetons sont stockés dans GNOME Keyring via libsecret."
    nl: "Meld u aan met uw Claude-account om het verbruik van het Max-abonnement op te halen. Tokens worden opgeslagen in GNOME Keyring via libsecret."
    de: "Melden Sie sich mit Ihrem Claude-Konto an, um die Nutzung des Max-Tarifs abzurufen. Tokens werden über libsecret in GNOME Keyring gespeichert."
    es: "Inicie sesión con su cuenta de Claude para obtener el uso del plan Max. Los tokens se almacenan en GNOME Keyring mediante libsecret."
    pt: "Inicie sessão com a sua conta Claude para obter a utilização do plano Max. Os tokens são armazenados no GNOME Keyring através do libsecret."
    sv: "Logga in med ditt Claude-konto för att hämta användning av Max-abonnemanget. Tokens lagras i GNOME Keyring via libsecret."
    cs: "Přihlaste se svým účtem Claude, abyste získali přehled o využití plánu Max. Tokeny se ukládají do GNOME Keyring prostřednictvím knihovny libsecret."
    pl: "Zaloguj się przy użyciu konta Claude, aby pobrać zużycie w planie Max. Tokeny są przechowywane w GNOME Keyring za pośrednictwem libsecret."
    ru: "Войдите со своей учётной записью Claude, чтобы получить данные об использовании тарифа Max. Токены сохраняются в GNOME Keyring через libsecret."
    uk: "Увійдіть зі своїм обліковим записом Claude, щоб отримати дані про використання тарифу Max. Токени зберігаються в GNOME Keyring через libsecret."
    ar: "سجّل الدخول بحسابك في Claude لجلب استخدام خطة Max. تُخزَّن الرموز في GNOME Keyring عبر libsecret."
    fa: "با حساب Claude خود وارد شوید تا میزان استفاده از طرح Max دریافت شود. توکن‌ها از طریق libsecret در GNOME Keyring ذخیره می‌شوند."
    zh: "使用您的 Claude 账户登录,以获取 Max 套餐用量。令牌通过 libsecret 存储在 GNOME Keyring 中。"
    ja: "Max プランの使用状況を取得するには、Claude アカウントでサインインしてください。トークンは libsecret 経由で GNOME Keyring に保存されます。"
    ko: "Max 요금제 사용량을 가져오려면 Claude 계정으로 로그인하십시오. 토큰은 libsecret을 통해 GNOME Keyring에 저장됩니다."
    tr: "Max planı kullanımını almak için Claude hesabınızla oturum açın. Belirteçler libsecret aracılığıyla GNOME Keyring içinde saklanır."
    it: "Accedi con il tuo account Claude per recuperare l'utilizzo del piano Max. I token sono memorizzati in GNOME Keyring tramite libsecret."
    hi: "Max प्लान का उपयोग प्राप्त करने के लिए अपने Claude खाते से साइन इन करें। टोकन libsecret के माध्यम से GNOME Keyring में संग्रहीत होते हैं।"
