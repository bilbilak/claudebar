  # Floating meter (Windows-specific)

  meter_section:
    en: "Floating desktop meter"
    fr: "Compteur flottant sur le bureau"
    nl: "Zwevende bureaubladmeter"
    de: "Schwebende Desktop-Anzeige"
    es: "Medidor flotante de escritorio"
    pt: "Medidor flutuante no ambiente de trabalho"
    sv: "Flytande skrivbordsmätare"
    cs: "Plovoucí měřič na ploše"
    pl: "Pływający miernik na pulpicie"
    ru: "Плавающий индикатор на рабочем столе"
    uk: "Плаваючий індикатор на робочому столі"
    ar: "مقياس عائم على سطح المكتب"
    fa: "سنجهٔ شناور روی دسکتاپ"
    zh: "桌面浮动计量器"
    ja: "デスクトップのフローティングメーター"
    ko: "데스크탑 부동 미터"
    tr: "Yüzen masaüstü göstergesi"
    it: "Indicatore mobile sul desktop"
    hi: "डेस्कटॉप पर तैरता मीटर"
  meter_enable:
    en: "Show always-on-top meter on the desktop"
    fr: "Afficher un compteur toujours visible sur le bureau"
    nl: "Toon altijd-bovenop meter op het bureaublad"
    de: "Immer im Vordergrund liegende Anzeige auf dem Desktop einblenden"
    es: "Mostrar un medidor siempre visible en el escritorio"
    pt: "Mostrar um medidor sempre visível no ambiente de trabalho"
    sv: "Visa alltid-överst-mätare på skrivbordet"
    cs: "Zobrazit měřič vždy navrchu na ploše"
    pl: "Pokaż miernik zawsze na wierzchu na pulpicie"
    ru: "Показывать индикатор поверх всех окон на рабочем столе"
    uk: "Показувати індикатор поверх усіх вікон на робочому столі"
    ar: "إظهار مقياس فوق كل النوافذ على سطح المكتب"
    fa: "نمایش سنجهٔ همیشه‌بالا روی دسکتاپ"
    zh: "在桌面上显示置顶计量器"
    ja: "デスクトップに常に最前面のメーターを表示"
    ko: "데스크탑에 항상 위에 표시되는 미터 표시"
    tr: "Masaüstünde her zaman üstte göstergeyi göster"
    it: "Mostra indicatore sempre in primo piano sul desktop"
    hi: "डेस्कटॉप पर हमेशा-शीर्ष पर मीटर दिखाएँ"
  meter_desc:
    en: "Small transparent widget rendering full-size bars. Draggable into any corner; right-click to lock or hide."
    fr: "Petit widget transparent affichant des barres en taille réelle. Déplaçable dans n'importe quel coin ; clic droit pour le verrouiller ou le masquer."
    nl: "Klein transparant widget dat balken op volledige grootte weergeeft. Versleepbaar naar elke hoek; klik met de rechtermuisknop om te vergrendelen of te verbergen."
    de: "Kleines transparentes Widget mit Balken in voller Größe. In jede Ecke ziehbar; mit Rechtsklick fixieren oder ausblenden."
    es: "Pequeño widget transparente que muestra barras a tamaño completo. Se puede arrastrar a cualquier esquina; haga clic con el botón derecho para bloquearlo u ocultarlo."
    pt: "Pequeno widget transparente que apresenta barras em tamanho real. Pode ser arrastado para qualquer canto; clique com o botão direito para bloquear ou ocultar."
    sv: "Liten genomskinlig widget som visar staplar i full storlek. Kan dras till valfritt hörn; högerklicka för att låsa eller dölja."
    cs: "Malý průhledný widget zobrazující pruhy v plné velikosti. Lze jej přetáhnout do libovolného rohu; kliknutím pravým tlačítkem jej uzamknete nebo skryjete."
    pl: "Mały przezroczysty widżet wyświetlający paski w pełnym rozmiarze. Można go przeciągnąć w dowolny róg; kliknij prawym przyciskiem myszy, aby zablokować lub ukryć."
    ru: "Небольшой прозрачный виджет с полноразмерными полосами. Можно перетащить в любой угол; правый клик — закрепить или скрыть."
    uk: "Невеликий прозорий віджет із повнорозмірними смугами. Перетягується в будь-який кут; клацніть правою кнопкою, щоб закріпити або приховати."
    ar: "أداة شفافة صغيرة تعرض أشرطة بحجم كامل. يمكن سحبها إلى أي ركن؛ انقر بزر الفأرة الأيمن للتثبيت أو الإخفاء."
    fa: "ابزارک کوچک و شفافی که نوارها را در اندازهٔ کامل نمایش می‌دهد. می‌توان آن را به هر گوشه‌ای کشید؛ برای قفل یا پنهان‌سازی، راست‌کلیک کنید."
    zh: "小型透明小部件,显示完整尺寸的条形。可拖动到任意角落;右键单击可锁定或隐藏。"
    ja: "フルサイズのバーを表示する小さな透明ウィジェット。任意の隅にドラッグでき、右クリックで固定または非表示にできます。"
    ko: "전체 크기의 막대를 표시하는 작은 투명 위젯입니다. 원하는 모서리로 끌어다 놓을 수 있으며, 마우스 오른쪽 버튼을 클릭하여 잠그거나 숨길 수 있습니다."
    tr: "Tam boyutlu çubuklar gösteren küçük şeffaf bir araç. İstediğiniz köşeye sürüklenebilir; kilitlemek veya gizlemek için sağ tıklayın."
    it: "Piccolo widget trasparente che mostra barre a grandezza naturale. Può essere trascinato in qualsiasi angolo; fai clic con il pulsante destro per bloccarlo o nasconderlo."
    hi: "पूर्ण आकार के बार दिखाने वाला छोटा पारदर्शी विजेट। किसी भी कोने में खींचा जा सकता है; लॉक करने या छिपाने के लिए दायाँ-क्लिक करें।"
  meter_show_percentages:
    en: "Show numeric percentages on the floating meter"
    fr: "Afficher les pourcentages numériques sur le compteur flottant"
    nl: "Numerieke percentages op de zwevende meter tonen"
    de: "Prozentwerte auf der schwebenden Anzeige einblenden"
    es: "Mostrar porcentajes numéricos en el medidor flotante"
    pt: "Mostrar percentagens numéricas no medidor flutuante"
    sv: "Visa numeriska procentvärden på den flytande mätaren"
    cs: "Zobrazit číselné procentní hodnoty na plovoucím měřiči"
    pl: "Pokaż wartości procentowe na pływającym mierniku"
    ru: "Показывать числовые проценты на плавающем индикаторе"
    uk: "Показувати числові відсотки на плаваючому індикаторі"
    ar: "إظهار النسب المئوية الرقمية على المقياس العائم"
    fa: "نمایش درصدهای عددی روی سنجهٔ شناور"
    zh: "在浮动计量器上显示数字百分比"
    ja: "フローティングメーターに数値のパーセンテージを表示"
    ko: "부동 미터에 숫자 백분율 표시"
    tr: "Yüzen göstergede sayısal yüzdeleri göster"
    it: "Mostra le percentuali numeriche sull'indicatore mobile"
    hi: "तैरते मीटर पर संख्यात्मक प्रतिशत दिखाएँ"
  meter_show_percentages_subtitle:
    en: "Adds session and weekly percentages next to the bars on the floating desktop meter (must be enabled below). The tray tooltip always shows percentages."
    fr: "Ajoute les pourcentages de session et hebdomadaires à côté des barres sur le compteur flottant du bureau (doit être activé ci-dessous). L'info-bulle de la barre d'état affiche toujours les pourcentages."
    nl: "Voegt sessie- en weekpercentages toe naast de balken op de zwevende bureaubladmeter (moet hieronder ingeschakeld zijn). De tooltip in het systeemvak toont altijd percentages."
    de: "Fügt die Sitzungs- und Wochenprozentwerte neben den Balken der schwebenden Desktop-Anzeige hinzu (muss unten aktiviert sein). Der Tooltip im Infobereich zeigt stets Prozentwerte an."
    es: "Añade los porcentajes de sesión y semanales junto a las barras del medidor flotante de escritorio (debe estar habilitado más abajo). La información sobre herramientas de la bandeja siempre muestra porcentajes."
    pt: "Adiciona as percentagens de sessão e semanais ao lado das barras no medidor flutuante do ambiente de trabalho (deve estar ativado abaixo). A dica de ferramenta da bandeja mostra sempre as percentagens."
    sv: "Lägger till session- och veckoprocent bredvid staplarna på den flytande skrivbordsmätaren (måste aktiveras nedan). Verktygstipset i aktivitetsfältet visar alltid procent."
    cs: "Přidá procentní hodnoty relace a týdne vedle pruhů na plovoucím měřiči na ploše (musí být povoleno níže). Popisek v oznamovací oblasti zobrazuje procenta vždy."
    pl: "Dodaje procenty sesji i tygodnia obok pasków na pływającym mierniku pulpitu (musi być włączone poniżej). Etykieta w zasobniku zawsze pokazuje wartości procentowe."
    ru: "Добавляет проценты сессии и недели рядом с полосами на плавающем индикаторе рабочего стола (должен быть включён ниже). Подсказка в трее всегда показывает проценты."
    uk: "Додає відсотки сесії та тижня поруч зі смугами на плаваючому індикаторі робочого стола (має бути ввімкнено нижче). Підказка в треї завжди показує відсотки."
    ar: "يضيف النسب المئوية للجلسة والأسبوع بجوار الأشرطة على المقياس العائم على سطح المكتب (يجب تمكينه أدناه). تعرض تلميحة الشريط النسب المئوية دائمًا."
    fa: "درصدهای نشست و هفتگی را در کنار نوارها روی سنجهٔ شناور دسکتاپ اضافه می‌کند (باید در پایین فعال شود). راهنمای سینی همیشه درصدها را نشان می‌دهد."
    zh: "在桌面浮动计量器的条形旁添加会话和每周百分比(必须在下方启用)。托盘提示始终显示百分比。"
    ja: "デスクトップのフローティングメーターのバーの横にセッションと週間のパーセンテージを追加します(下で有効にする必要があります)。トレイのツールチップには常にパーセンテージが表示されます。"
    ko: "부동 데스크탑 미터의 막대 옆에 세션 및 주간 백분율을 추가합니다(아래에서 활성화해야 함). 트레이 도구 설명에는 항상 백분율이 표시됩니다."
    tr: "Yüzen masaüstü göstergesindeki çubukların yanına oturum ve haftalık yüzdeleri ekler (aşağıdan etkinleştirilmelidir). Sistem tepsisindeki ipucu her zaman yüzdeleri gösterir."
    it: "Aggiunge le percentuali di sessione e settimanali accanto alle barre sull'indicatore mobile del desktop (deve essere abilitato qui sotto). Il suggerimento nella barra delle applicazioni mostra sempre le percentuali."
    hi: "तैरते डेस्कटॉप मीटर पर बार के बगल में सत्र और साप्ताहिक प्रतिशत जोड़ता है (नीचे सक्षम होना चाहिए)। ट्रे टूलटिप हमेशा प्रतिशत दिखाता है।"
