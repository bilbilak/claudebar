    nl: "Numerieke percentages naast de balken tonen"
    de: "Prozentwerte neben den Balken anzeigen"
    es: "Mostrar porcentajes numéricos junto a las barras"
    pt: "Mostrar percentagens numéricas ao lado das barras"
    sv: "Visa numeriska procentvärden bredvid staplarna"
    cs: "Zobrazit číselné procentní hodnoty vedle pruhů"
    pl: "Pokazuj wartości procentowe obok pasków"
    ru: "Показывать числовые проценты рядом с полосами"
    uk: "Показувати числові відсотки поруч зі смугами"
    ar: "إظهار النسب المئوية الرقمية بجانب الأشرطة"
    fa: "نمایش درصدهای عددی کنار نوارها"
    zh: "在条形旁显示数字百分比"
    ja: "バーの横に数値のパーセンテージを表示"
    ko: "막대 옆에 숫자 백분율 표시"
    tr: "Çubukların yanında sayısal yüzdeleri göster"
    it: "Mostra le percentuali numeriche accanto alle barre"
    hi: "बार के बगल में संख्यात्मक प्रतिशत दिखाएँ"
  prefs_color_thresholds_desc:
    en: "When bars switch from green to orange to red."
    fr: "Quand les barres passent du vert à l'orange puis au rouge."
    nl: "Wanneer balken van groen naar oranje en vervolgens naar rood overgaan."
    de: "Wann die Balken von Grün auf Orange und dann auf Rot wechseln."
    es: "Cuándo las barras pasan de verde a naranja y luego a rojo."
    pt: "Quando as barras passam de verde para laranja e depois para vermelho."
    sv: "När staplarna växlar från grönt till orange till rött."
    cs: "Kdy pruhy přejdou ze zelené přes oranžovou až na červenou."
    pl: "Kiedy paski zmieniają kolor z zielonego na pomarańczowy, a następnie czerwony."
    ru: "Когда полосы меняют цвет с зелёного на оранжевый, затем на красный."
    uk: "Коли смуги змінюють колір із зеленого на помаранчевий, а потім на червоний."
    ar: "متى تتغير الأشرطة من الأخضر إلى البرتقالي ثم إلى الأحمر."
    fa: "زمانی که رنگ نوارها از سبز به نارنجی و سپس قرمز تغییر می‌کند."
    zh: "条形从绿色变为橙色再变为红色的时机。"
    ja: "バーが緑からオレンジ、そして赤に切り替わるタイミング。"
    ko: "막대 색상이 녹색에서 주황색, 빨간색으로 바뀌는 시점입니다."
    tr: "Çubukların yeşilden turuncuya ve kırmızıya geçtiği eşikler."
    it: "Quando le barre passano dal verde all'arancione e poi al rosso."
    hi: "जब बार हरे से नारंगी और फिर लाल हो जाते हैं।"
