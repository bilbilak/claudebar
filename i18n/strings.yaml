    pl: "Niewielkie wartości procentowe sesji i tygodnia, ułożone obok pasków."
    ru: "Небольшие проценты сессии и недели, расположенные рядом с полосами."
    uk: "Невеликі відсотки сесії та тижня, розташовані поруч зі смугами."
    ar: "نسب مئوية صغيرة للجلسة والأسبوع، مرتّبة بجانب الأشرطة."
    fa: "درصدهای کوچک نشست و هفتگی، در کنار نوارها روی هم چیده می‌شوند."
    zh: "在条形旁堆叠显示小号的会话和每周百分比。"
    ja: "セッションと週間の小さなパーセンテージをバーの横に縦に並べて表示します。"
    ko: "막대 옆에 작은 세션 및 주간 백분율이 세로로 표시됩니다."
    tr: "Çubukların yanında üst üste dizilmiş küçük oturum ve haftalık yüzdeler."
    it: "Piccole percentuali di sessione e settimanali, impilate accanto alle barre."
    hi: "बार के बगल में लंबवत रूप से छोटे सत्र और साप्ताहिक प्रतिशत।"
  prefs_show_percentages_beside:
    en: "Show numeric percentages beside the bars"
