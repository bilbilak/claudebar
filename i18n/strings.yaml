# ClaudeBar — master translation source (v1.3.0)
#
# All user-visible strings across every platform live here as the canonical
# English source. Per-platform translation files (.po, .xcstrings, .resx, .wxl)
# are populated from this file.
#
# Placeholder syntax: %d (integer), %s (string). Where two of the same type
# appear, the order is positional — translations MUST preserve that order.
# E.g. "in %dh %dm" → the first %d is hours, the second is minutes.
#
# Keys are snake_case; group prefixes (menu_, prefs_, status_, …) are not
# semantic — they're just for human navigation in this file.

